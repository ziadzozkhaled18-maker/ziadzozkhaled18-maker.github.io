<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Leave a Google review</title>
<!-- Card YHA4. To re-point this card: change the url= value below and
     the matching href on the last line. Nothing else in this file matters. -->
<meta http-equiv="refresh" content="0; url=https://search.google.com/local/writereview?placeid=ChIJN1t_tDeuEmsRUsoyG83frY4">
<script>
(function () {
  try {
    var meta = document.querySelector('meta[http-equiv="refresh"]');
    if (!meta) return;
    var content = meta.getAttribute('content') || '';
    var at = content.indexOf('url=');
    if (at < 0) return;
    var target = content.slice(at + 4).trim();
    // Deliberately no regex: only an exact https:// prefix is followed.
    if (target.indexOf('https://') === 0) location.replace(target);
  } catch (e) { /* meta refresh already handles it */ }
})();
</script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f6f7f9;color:#555;text-align:center;padding:24px}</style>
</head>

<p>Opening Google reviews&hellip;<br><a href="https://search.google.com/local/writereview?placeid=ChIJN1t_tDeuEmsRUsoyG83frY4">Tap here if nothing happens</a></p>
</body>
</html>
