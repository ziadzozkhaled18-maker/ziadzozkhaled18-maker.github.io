<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Card not activated yet</title>
<style>
:root{color-scheme:light dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7f9;color:#1a1a1a;
font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px}
.c{max-width:26rem;text-align:center;background:#fff;padding:32px 26px;border-radius:16px;
box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06)}
h1{font-size:1.25rem;margin:0 0 .5rem}p{margin:.5rem 0;color:#555}
.ar{direction:rtl;font-size:.95rem;color:#666;border-top:1px solid #eee;margin-top:1.25rem;padding-top:1rem}
code{background:#f0f1f3;padding:.15em .45em;border-radius:5px;font-size:.95em}
.s{font-size:2rem;letter-spacing:.1em}
@media (prefers-color-scheme:dark){body{background:#16181c;color:#e8e8e8}
.c{background:#22252b;box-shadow:none}p{color:#a9adb5}.ar{color:#9aa0a8;border-color:#31343b}
code{background:#2c3038}}
</style>
</head>
<body>
<div class="c">
<div class="s">&#11088;</div>
<h1>This card is not set up yet</h1>
<p>Card <code>KXQ2</code> has not been linked to a business.</p>
<p>If you own this card, send us the code above and we will activate it.</p>
<p>WhatsApp +20 XXX XXX XXXX</p>
<div class="ar">هذه البطاقة لم يتم تفعيلها بعد. تواصل معنا وارسل الكود الموجود بالأعلى.</div>
</div>
</body>
</html>
